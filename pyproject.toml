[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dzdk"
dynamic = ["version"]
description = "Dzaleka Online Services CLI and terminal UI - services, jobs, events, news and the Dzaleka Encyclopedia from your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Bakari", email = "bakari@mail.dzaleka.com" }
]
keywords = ["dzaleka", "refugee", "malawi", "cli", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "requests>=2.28",
    "rich>=13.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "textual>=1.0",
    "textual-plotext>=1.0",
]

[project.optional-dependencies]
serve = ["textual-serve>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "textual-dev>=1.0",
]

[project.scripts]
dzdk = "dzdk.cli:main"

[project.urls]
Homepage = "https://github.com/Dzaleka-Connect/dzdk-cli"
Documentation = "https://services.dzaleka.com/docs/dzdk-cli"
Repository = "https://github.com/Dzaleka-Connect/dzdk-cli.git"
Issues = "https://github.com/Dzaleka-Connect/dzdk-cli/issues"

[tool.hatch.version]
path = "dzdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dzdk"]

[tool.hatch.build.targets.sdist]
include = [
    "dzdk",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "doc.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "pytest.ini",
    "requirements.txt",
    "requirements-dev.txt",
]
